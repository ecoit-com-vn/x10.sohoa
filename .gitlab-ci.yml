workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

stages:
  - build
  - deploy
  - backup

default:
  tags:
    - x10-runner

frontend-build:
  stage: build
  image: docker:latest
  environment:
    name: $CI_COMMIT_BRANCH
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA -t $REGISTRY/$CI_PROJECT_PATH:latest -f Dockerfile .
    - docker push $REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA
    - docker push $REGISTRY/$CI_PROJECT_PATH:latest
    
frontend-deploy:
  stage: deploy
  environment:
    name: $CI_COMMIT_BRANCH
  image:
    name: line/kubectl-kustomize:latest
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - if [ -f "$KUBERNETES_KUBE_CONFIG" ]; then cp "$KUBERNETES_KUBE_CONFIG" ~/.kube/config; else echo "$KUBERNETES_KUBE_CONFIG" > ~/.kube/config; fi
    - chmod 600 ~/.kube/config
  script:
    - 'sed -i "s|image:\s*$REGISTRY/$CI_PROJECT_PATH:latest|image: $REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA|g" deploy/k8s-deploy.yaml'
    - kubectl apply -f deploy/k8s-deploy.yaml
    - kubectl rollout status deployment/sohoa-frontend -n x10 --timeout=150s

frontend-backup-github:
  stage: backup
  image: alpine/git:latest
  needs:
    - job: frontend-deploy
      artifacts: false
  script:
    - git clone "$CI_REPOSITORY_URL" repo-mirror
    - cd repo-mirror
    - git checkout "$CI_COMMIT_SHA"
    - git remote add github "https://x-access-token:${GITHUB_BACKUP_TOKEN}@github.com/ecoit-com-vn/x10.sohoa.git"
    - git push github "HEAD:refs/heads/frontend-${CI_COMMIT_REF_SLUG}" --force
