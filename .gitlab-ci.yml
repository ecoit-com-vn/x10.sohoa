workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
    
stages:
  - test
  - build
  - deploy
  - backup

variables:
  REGISTRY: "harbor.ecoit.vn"
  DOTNET_ROLL_FORWARD: "Major"

default:
  tags:
    - x10-runner

backend-test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet test EvnHanoi.Digitization.slnx --configuration Release

backend-build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  environment:
    name: $CI_COMMIT_BRANCH
  before_script:
    - apt-get update && apt-get install -y docker.io
  script:
    - dotnet tool install -g Aspirate
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet workload install aspire
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - cd Aspire/EvnHanoi.AppHost
    - |
      sed -i 's/"containerRegistry": "harbor.ecoit.vn"/"containerRegistry": ""/g' aspirate-state.json
    - |
      sed -i 's/"Registry": "harbor.ecoit.vn"/"Registry": ""/g' aspirate.json
    - aspirate build --non-interactive
    - |
      sed -i 's/"containerRegistry": ""/"containerRegistry": "harbor.ecoit.vn"/g' aspirate-state.json
    - |
      sed -i 's/"Registry": ""/"Registry": "harbor.ecoit.vn"/g' aspirate.json
    - |
      for service in identityservice equipmentservice digitizationservice notificationservice syncservice workflowservice reportservice apigateway; do
        docker tag x10/backend/${service}:latest harbor.ecoit.vn/x10/backend/${service}:latest
        docker push harbor.ecoit.vn/x10/backend/${service}:latest
      done

backend-deploy:
  stage: deploy
  image:
    name: line/kubectl-kustomize:latest
    entrypoint: [""]
  environment:
    name: $CI_COMMIT_BRANCH
  before_script:
    - mkdir -p ~/.kube
    - if [ -f "$KUBERNETES_KUBE_CONFIG" ]; then cp "$KUBERNETES_KUBE_CONFIG" ~/.kube/config; else echo "$KUBERNETES_KUBE_CONFIG" > ~/.kube/config; fi
    - chmod 600 ~/.kube/config
  script:
    - kubectl cluster-info
    - cd Aspire/EvnHanoi.AppHost/overlays/production
    - kubectl apply -k .
    - |
      for service in identityservice equipmentservice digitizationservice notificationservice syncservice workflowservice reportservice apigateway; do
        kubectl rollout restart deployment/${service} -n x10
      done

backend-backup-github:
  stage: backup
  image: alpine/git:latest
  needs:
    - job: backend-deploy
      artifacts: false
  script:
    - git clone "$CI_REPOSITORY_URL" repo-mirror
    - cd repo-mirror
    - git checkout "$CI_COMMIT_SHA"
    - git remote add github "https://x-access-token:${GITHUB_BACKUP_TOKEN}@github.com/ecoit-com-vn/x10.sohoa.git"
    - git push github "HEAD:refs/heads/backend-${CI_COMMIT_REF_SLUG}" --force
