apiVersion: apps/v1
kind: Deployment
metadata:
  name: sohoa-frontend
  namespace: x10
  labels:
    app: sohoa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sohoa-frontend
  template:
    metadata:
      labels:
        app: sohoa-frontend
    spec:
      containers:
      - name: frontend
        image: git.ecoit.com.vn/evnhanoi/x10/sohoa.frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http-port
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sohoa-frontend-svc
  namespace: x10
  labels:
    app: sohoa-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: sohoa-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sohoa-frontend-ingress
  namespace: x10
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sohoa-frontend-svc
            port:
              number: 80
