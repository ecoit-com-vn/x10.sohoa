apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
spec:
  template:
    spec:
      containers:
      - name: identityservice
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: ORACLE_CONN_STRING
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: RABBITMQ_PASS
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: RABBITMQ_USER
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_KEY
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: RABBITMQ_PORT
        - name: Elasticsearch__Uri
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ELASTICSEARCH_URL
        - name: Elasticsearch__Url
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ELASTICSEARCH_URL
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_ISSUER
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_AUDIENCE
---
