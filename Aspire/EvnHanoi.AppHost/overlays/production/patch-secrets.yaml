apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncservice
spec:
  template:
    spec:
      containers:
      - name: syncservice
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: ORACLE_CONN_STRING
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: RABBITMQ_PASS
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: RABBITMQ_USER
        - name: ConnectionStrings__Redis
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_HOST
        - name: RabbitMQ__Host
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: RABBITMQ_PORT
        - name: Elasticsearch__Url
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ELASTICSEARCH_URL
        - name: Pmis__ApiUrl
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PMIS_API_URL
        - name: Pmis__SyncIntervalMinutes
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PMIS_SYNC_INTERVAL
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_AUDIENCE
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: JWT_ISSUER
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_KEY
        - name: Services__EquipmentService
          value: "http://equipmentservice:8080"
        - name: Internal__Token
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: INTERNAL_TOKEN
        # --- Tối ưu đồng bộ PMIS (Đợt 0, 2026-10-09) — xem DE_XUAT_TOI_UU_JOB_DONG_BO_PMIS.md ---
        # Tải file tài liệu: PMIS trả ~52 ms/file nên nút thắt là BatchSize (50/phút = 3.000 file/giờ). EquipmentService giới hạn 200 tài liệu/lần lấy.
        - name: Pmis__DocumentFile__BatchSize
          value: "200"
        - name: Pmis__DocumentFile__InitialParallel
          value: "4"
        - name: Pmis__DocumentFile__MaxParallel
          value: "8"
        # Đồng bộ thiết bị: dành 95% ngân sách thời gian cho pha quét cha (mặc định 0,75) và đệm 5 phút (mặc định 10) trong giai đoạn đồng bộ lại ban đầu.
        - name: Pmis__IncrementalSync__ParentScanTimeShare
          value: "0.95"
        - name: Pmis__Schedule__RunBudgetBufferMinutes
          value: "5"
---
