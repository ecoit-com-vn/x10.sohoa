---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
  labels:
    app: identityservice
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
      - name: identityservice
        image: harbor.ecoit.vn/x10/backend/identityservice:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: identityservice-env
      terminationGracePeriodSeconds: 180
