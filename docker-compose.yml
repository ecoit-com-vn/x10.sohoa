version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: evnhanoi_oracle
    environment:
      - ORACLE_PASSWORD=password
      - APP_USER=IdentityDB
      - APP_USER_PASSWORD=password
    ports:
      - "1521:1521"
    volumes:
      - ./docker-data/oracle:/opt/oracle/oradata
    networks:
      - evnhanoi_network

  redis:
    image: redis:alpine
    container_name: evnhanoi_redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    networks:
      - evnhanoi_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evnhanoi_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=orcadmin
      - RABBITMQ_DEFAULT_PASS=orcpassword123
      - RABBITMQ_DEFAULT_VHOST=/orc
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - evnhanoi_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: evnhanoi_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - evnhanoi_network

  minio:
    image: minio/minio
    container_name: evnhanoi_minio
    environment:
      - MINIO_ROOT_USER=orcminio
      - MINIO_ROOT_PASSWORD=orcminiopassword123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data
    networks:
      - evnhanoi_network

networks:
  evnhanoi_network:
    driver: bridge

volumes:
  rabbitmq_data:
  elasticsearch_data:

