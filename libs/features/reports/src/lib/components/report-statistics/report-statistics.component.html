<!-- sohoa.frontend/libs/features/reports/src/lib/components/report-statistics/report-statistics.component.html -->
<p-toast></p-toast>
<div class="wf-page">
    <div class="list-toolbar standard-page-toolbar">
        <div class="toolbar-left">
            <wf-breadcrumb></wf-breadcrumb>
        </div>
    </div>

    <div>
        <!-- Filters Toolbar -->
        <!-- Filters Toolbar -->
        <div class="list-toolbar">

            <!-- Bộ lọc -->
            <div class="toolbar-filters">

                <div class="filter-item search-item">
                    <label>Từ khóa</label>
                    <input type="text" class="wf-input" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)" (keyup.enter)="onSearch()" placeholder="Tìm theo mã hoặc tên báo cáo..." />
                </div>

                <div class="filter-item">
                    <label>Trạng thái</label>
                    <select class="wf-select" [ngModel]="searchStatus()" (ngModelChange)="onStatusFilterChange($event)">
        <option value="">-- Tất cả trạng thái --</option>
        <option value="published">Công bố</option>
        <option value="draft">Lưu nháp</option>
        <option value="not_configured">Chưa cấu hình</option>
      </select>
                </div>

            </div>

            <!-- Nút -->
            <div class="toolbar-actions">
                <button type="button" class="btn-outlined btn-small" (click)="onResetSearch()">
      <i class="pi pi-refresh"></i>
      Làm mới
    </button>
                <button type="button" class="btn-save btn-small" (click)="onSearch()" [disabled]="loading()">
      <i class="pi pi-check"></i>
      Áp dụng
    </button>
            </div>

        </div>

        <!-- Table Grid -->
        <div class="wf-card">
            <div class="wf-table-wrap" *ngIf="!loading(); else loadingTemplate">
                <table class="wf-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;" class="text-center">STT</th>
                            <th style="width: 240px;">Mã báo cáo</th>
                            <th>Tên báo cáo</th>
                            <th style="width: 150px;" class="text-center">Trạng thái</th>
                            <th style="width: 100px;" class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let report of pagedReports(); let i = index">
                            <td class="text-center text-muted">{{ (currentPage() - 1) * pageSize() + i + 1 }}</td>
                            <td><span style="color: #0284c7; font-weight: 400;">{{ report.code }}</span></td>
                            <td>
                                <span class="wf-name-link" style="cursor: pointer; color: #334155; font-weight: 400;" (click)="viewReport(report)">
                {{ report.name }}
              </span>
                            </td>
                            <td class="text-center">
                                <span [ngSwitch]="report.status">
                  <span *ngSwitchCase="'published'" class="badge status-published">Công bố</span>
                                <span *ngSwitchCase="'draft'" class="badge status-draft">Lưu nháp</span>
                                <span *ngSwitchCase="'not_configured'" class="badge status-not-configured">Chưa cấu hình</span>
                                </span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="act-btn-dot" (click)="viewReport(report)" pTooltip="Xem báo cáo" tooltipPosition="top" title="Xem báo cáo" style="background: transparent; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; color: #64748b; transition: all 0.2s;">
                <i class="pi pi-eye" style="font-size: 0.875rem; vertical-align: middle;"></i>
              </button>
                            </td>
                        </tr>
                        <tr *ngIf="filteredReports().length === 0">
                            <td colspan="5" class="empty-row text-center py-5 text-muted">
                                <i class="pi pi-inbox block text-3xl mb-2" style="color: #cbd5e1;"></i> Không tìm thấy báo cáo nào được phân quyền cho bạn.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-footer-paginator" *ngIf="filteredReports().length > 0">
                <span class="record-count">
          Tổng số: <b>{{ filteredReports().length }}</b> báo cáo.
        </span>
                <app-eco-paginator [first]="(currentPage() - 1) * pageSize()" [rows]="pageSize()" [totalRecords]="filteredReports().length" [rowsPerPageOptions]="[5, 10, 20, 50]" (onPageChange)="onUnitPageChange($event)">
                </app-eco-paginator>
            </div>

            <!-- Loading state -->
            <ng-template #loadingTemplate>
                <div class="text-center py-5 text-muted">
                    <i class="pi pi-spin pi-spinner text-3xl mb-2" style="color: #002D72;"></i>
                    <div>Đang tải dữ liệu...</div>
                </div>
            </ng-template>
        </div>
    </div>
</div>
