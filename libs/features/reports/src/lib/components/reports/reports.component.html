
    <div class="wf-page">
      <p-toast></p-toast>
      <div class="wf-card">
        
        <!-- Breadcrumb -->
        <div class="breadcrumb mb-4">
          <i class="pi pi-home bc-icon"></i>
          <span class="bc-text">Trang chủ</span>
          <span class="bc-sep">/</span>
          <span class="bc-text">Báo cáo thống kê</span>
          <span class="bc-sep">/</span>
          <span class="bc-current">Báo cáo động</span>
        </div>

        <div class="edit-header mb-4">
          <h2 class="edit-title" style="color: #002D72; font-size: 1.5rem; font-weight: 700;">Hệ thống Báo cáo Động EVNHANOI</h2>
        </div>

        <!-- Tab Bar -->
        <div class="flex border-b border-gray-200 mb-6">
          <button 
            class="py-2.5 px-5 text-sm font-semibold border-b-2 transition-colors focus:outline-none flex items-center" 
            [ngClass]="activeTab === 'view' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
            (click)="activeTab = 'view'"
          >
            <i class="pi pi-chart-bar mr-2"></i> Xem Báo cáo
          </button>
          
          <button 
            class="py-2.5 px-5 text-sm font-semibold border-b-2 transition-colors focus:outline-none flex items-center" 
            [ngClass]="activeTab === 'designer' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
            (click)="activeTab = 'designer'"
          >
            <i class="pi pi-cog mr-2"></i> Thiết kế Báo cáo Động
          </button>
          
          <button 
            class="py-2.5 px-5 text-sm font-semibold border-b-2 transition-colors focus:outline-none flex items-center" 
            [ngClass]="activeTab === 'group' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
            (click)="activeTab = 'group'"
          >
            <i class="pi pi-folder-open mr-2"></i> Quản lý Nhóm Báo cáo
          </button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content">
          <app-report-viewer *ngIf="activeTab === 'view'"></app-report-viewer>
          <app-report-designer *ngIf="activeTab === 'designer'"></app-report-designer>
          <app-report-group-manager *ngIf="activeTab === 'group'"></app-report-group-manager>
        </div>

      </div>
    </div>
