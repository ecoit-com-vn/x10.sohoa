<p-dialog
  [header]="title"
  [(visible)]="visible"
  (onShow)="onShow()"
  (onHide)="close()"
  [modal]="true"
  appendTo="body"
  [closable]="!saving()"
  styleClass="evn-dialog-custom"
  [style]="{ width: '520px' }">

  <!-- Loading shimmer khi chưa sẵn sàng dữ liệu -->
  <div *ngIf="loading() || !isDataReady()" class="dialog-form-skeleton">
    <div class="skeleton-bar"></div>
    <div class="skeleton-bar"></div>
  </div>

  <div *ngIf="!loading() && isDataReady()" style="display: flex; flex-direction: column; gap: 14px; padding-top: 10px;">
    <div class="form-group">
      <label class="form-label">Thư mục phân bổ <span class="required">*</span></label>
      <p-treeSelect
        [options]="folderTreeOptions()"
        [ngModel]="selectedFolderNode()"
        (ngModelChange)="onFolderNodeChange($event)"
        placeholder="-- Chọn thư mục nhập liệu --"
        [filter]="true"
        filterPlaceholder="Tìm kiếm thư mục..."
        styleClass="w-full"
        [style]="{ width: '100%' }"
        appendTo="body"
        scrollHeight="250px">
      </p-treeSelect>
    </div>

    <div class="form-group">
      <label class="form-label" style="font-weight: 600; margin-bottom: 6px; display: block; color: #374151;">Người xử lý <span class="required" style="color: #ef4444;">*</span></label>
      <p-select
        [options]="userSelectOptions()"
        [ngModel]="selectedUserId()"
        (ngModelChange)="selectedUserId.set($event)"
        optionLabel="name"
        optionValue="id"
        [filter]="true"
        filterPlaceholder="Tìm kiếm người xử lý..."
        placeholder="-- Chọn người phụ trách nhập liệu --"
        [disabled]="saving()"
        appendTo="body"
        [style]="selectFieldStyle">
      </p-select>
    </div>
  </div>

  <ng-template #footer>
    <div class="dialog-form-footer">
      <button
        type="button"
        class="btn-cancel btn-small"
        (click)="close()"
        [disabled]="saving()">
        <i class="pi pi-times"></i> Hủy
      </button>
      <button
        type="button"
        class="btn-save btn-small"
        (click)="save()"
        [disabled]="saving()">
        <i class="pi pi-spin pi-spinner" *ngIf="saving()" style="margin-right: 4px;"></i>
        <i class="pi pi-pencil" *ngIf="!saving() && allocationId" style="margin-right: 4px;"></i>
        <i class="pi pi-plus" *ngIf="!saving() && !allocationId" style="margin-right: 4px;"></i>
        {{ saving() ? 'Đang lưu...' : (allocationId ? 'Cập nhật' : 'Thêm mới') }}
      </button>
    </div>
  </ng-template>
</p-dialog>
