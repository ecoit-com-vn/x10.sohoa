<div class="scanner-panel">
  <div class="scanner-controls">

    <div class="scanner-filename-input">

        <p class="input-label">
            Tên file lưu sau khi quét
        </p>

        <div class="filename-box">

            <i class="pi pi-file"></i>

            <input
                id="scan-filename"
                type="text"
                [(ngModel)]="fileName"
                placeholder="VD: VanBanTrinhDuyet_So1"
                [disabled]="scanning()"
            />

            <span>.pdf</span>

        </div>

        <small>Không cần nhập phần mở rộng (.pdf)</small>

    </div>

    <button
        type="button"
        class="btn-green btn-small scan-btn"
        [disabled]="disabled() || scanning()"
        (click)="startScan()"
    >
        <i class="pi"
            [ngClass]="scanning() ? 'pi-spin pi-spinner' : 'pi-print'">
        </i>

        {{ scanning() ? 'Đang quét...' : 'Quét tài liệu (PDF)' }}

    </button>

</div>

  <p class="scanner-status">
    <i class="pi pi-info-circle"></i>
    {{ statusMessage() }}
  </p>
  <p class="scanner-hint" *ngIf="!scanning()">
    Sau khi bấm quét, cửa sổ <strong>EcoScanner</strong> sẽ mở — chọn máy scan và bấm <strong>Quét</strong> (không bấm Hủy).
  </p>
  <p class="scanner-hint scanner-waiting" *ngIf="scanning()">
    <i class="pi pi-spin pi-spinner"></i>
    Đang chờ bạn quét trên cửa sổ <strong>EcoScanner</strong>. Không đóng popup web trong lúc này.
  </p>

  <div class="scanner-preview" *ngIf="previewUrl()">
    <iframe *ngIf="previewKind() === 'pdf'" [src]="safePreviewUrl()" title="Xem trước PDF quét"></iframe>
    <img *ngIf="previewKind() === 'image'" [src]="previewUrl()" alt="Xem trước ảnh quét" />
  </div>
</div>
