<div class="wf-page">
  <p-toast></p-toast>

  <wf-breadcrumb />

  <div class="wf-card">
    <div class="password-header">
      <div>
        <h2>Đổi mật khẩu</h2>
        <p>Cập nhật mật khẩu đăng nhập cho tài khoản hiện tại.</p>
      </div>
    </div>

    <form class="password-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Mật khẩu hiện tại <span class="required">*</span></label>
        <div class="password-input">
          <input
            class="wf-input w-full"
            [type]="visible().currentPassword ? 'text' : 'password'"
            name="currentPassword"
            [ngModel]="currentPassword()"
            (ngModelChange)="setValue('currentPassword', $event)"
            [disabled]="saving()"
            autocomplete="current-password" />
          <button type="button" class="password-toggle" (click)="toggleVisible('currentPassword')" [disabled]="saving()">
            <i [class]="visible().currentPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <span class="field-error" *ngIf="currentPasswordError()">{{ currentPasswordError() }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu mới <span class="required">*</span></label>
        <div class="password-input">
          <input
            class="wf-input w-full"
            [type]="visible().newPassword ? 'text' : 'password'"
            name="newPassword"
            [ngModel]="newPassword()"
            (ngModelChange)="setValue('newPassword', $event)"
            [disabled]="saving()"
            autocomplete="new-password" />
          <button type="button" class="password-toggle" (click)="toggleVisible('newPassword')" [disabled]="saving()">
            <i [class]="visible().newPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <span class="field-error" *ngIf="newPasswordError()">{{ newPasswordError() }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Xác nhận mật khẩu mới <span class="required">*</span></label>
        <div class="password-input">
          <input
            class="wf-input w-full"
            [type]="visible().confirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [ngModel]="confirmPassword()"
            (ngModelChange)="setValue('confirmPassword', $event)"
            [disabled]="saving()"
            autocomplete="new-password" />
          <button type="button" class="password-toggle" (click)="toggleVisible('confirmPassword')" [disabled]="saving()">
            <i [class]="visible().confirmPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
        <span class="field-error" *ngIf="confirmPasswordError()">{{ confirmPasswordError() }}</span>
      </div>

      <div class="password-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="saving()">
          <i class="pi pi-times"></i>
          Hủy
        </button>
        <button type="submit" class="btn-save" [disabled]="saving()">
          <i class="pi pi-spin pi-spinner" *ngIf="saving()"></i>
          <i class="pi pi-key" *ngIf="!saving()"></i>
          Đổi mật khẩu
        </button>
      </div>
    </form>
  </div>
</div>
