<div class="wf-page profile-page">
  <p-toast></p-toast>

  <div class="profile-topbar">
    <wf-breadcrumb [customItems]="breadcrumbItems" />

    <div class="profile-topbar-actions" *ngIf="!loading() && profile()">
      <button type="button" class="btn-back" (click)="onCancel()" [disabled]="saving()">
        <i class="pi pi-arrow-left"></i>
        Quay lại
      </button>
      <button type="submit" form="profileForm" class="btn-save" [disabled]="saving()">
        <i class="pi pi-spin pi-spinner" *ngIf="saving()"></i>
        <i class="pi pi-save" *ngIf="!saving()"></i>
        Lưu lại
      </button>
    </div>
  </div>

  <div *ngIf="loading()" class="profile-loading">
    <i class="pi pi-spin pi-spinner"></i>
    <span>Đang tải thông tin...</span>
  </div>

  <form id="profileForm" *ngIf="!loading() && profile()" class="profile-panel" (ngSubmit)="onSave()">
    <div class="profile-panel-title">Chỉnh sửa thông tin</div>

    <div class="profile-avatar-row">
      <div class="avatar-picker">
        <div class="avatar-preview">
          <img *ngIf="displayAvatarUrl()" [src]="displayAvatarUrl()" alt="Ảnh đại diện" />
          <i *ngIf="!displayAvatarUrl()" class="pi pi-user"></i>
        </div>

        <button
          type="button"
          class="avatar-edit-btn"
          (click)="toggleAvatarMenu($event)"
          [disabled]="avatarSaving() || avatarDeleting()"
          title="Ảnh đại diện">
          <i class="pi pi-camera"></i>
        </button>

        <div class="avatar-menu" *ngIf="avatarMenuOpen()" (click)="$event.stopPropagation()">
          <button type="button" (click)="openAvatarPicker()" [disabled]="avatarSaving() || avatarDeleting()">
            <i class="pi pi-upload"></i>
            Đổi ảnh
          </button>
          <button type="button" *ngIf="selectedAvatarFile()" (click)="uploadSelectedAvatar()" [disabled]="avatarSaving()">
            <i class="pi pi-spin pi-spinner" *ngIf="avatarSaving()"></i>
            <i class="pi pi-check" *ngIf="!avatarSaving()"></i>
            Lưu ảnh
          </button>
          <button type="button" *ngIf="selectedAvatarFile()" (click)="clearSelectedAvatar()" [disabled]="avatarSaving()">
            <i class="pi pi-times"></i>
            Hủy ảnh
          </button>
          <button type="button" class="danger" *ngIf="profile()?.avatarObjectKey && !selectedAvatarFile()" (click)="deleteAvatar()" [disabled]="avatarDeleting()">
            <i class="pi pi-spin pi-spinner" *ngIf="avatarDeleting()"></i>
            <i class="pi pi-trash" *ngIf="!avatarDeleting()"></i>
            Xóa ảnh
          </button>
        </div>
      </div>

      <span class="field-error" *ngIf="avatarError()">{{ avatarError() }}</span>

      <input
        #avatarInput
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
        (change)="onAvatarSelected($event)" />
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Họ và tên <span class="required">*</span></label>
        <input
          class="wf-input w-full"
          type="text"
          name="fullName"
          [ngModel]="profile()?.fullName"
          (ngModelChange)="setField('fullName', $event)"
          [disabled]="saving()"
          placeholder="Nhập họ và tên" />
        <span class="field-error" *ngIf="fullNameError()">{{ fullNameError() }}</span>
      </div>

      <div class="form-group">
        <label class="form-label">Tên đăng nhập</label>
        <input class="wf-input w-full readonly-input" type="text" [ngModel]="profile()?.username" name="usernameReadonly" disabled />
      </div>

      <div class="form-group">
        <label class="form-label">Chức danh</label>
        <select
          class="wf-select w-full"
          name="positionId"
          [ngModel]="profile()?.positionId"
          (ngModelChange)="setField('positionId', $event)"
          [disabled]="saving()">
          <option [ngValue]="null">-- Chọn chức danh --</option>
          <option *ngFor="let p of positions()" [ngValue]="p.id">{{ p.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Chọn đơn vị</label>
        <input class="wf-input w-full readonly-input" type="text" [ngModel]="getOrganizationName()" name="organizationUnitReadonly" disabled />
      </div>

      <div class="form-group">
        <label class="form-label">Email <span class="required">*</span></label>
        <input
          class="wf-input w-full"
          type="email"
          name="email"
          [ngModel]="profile()?.email"
          (ngModelChange)="setField('email', $event)"
          [disabled]="saving()"
          placeholder="example@evnhanoi.vn" />
        <span class="field-error" *ngIf="emailError()">{{ emailError() }}</span>
      </div>
    </div>
  </form>
</div>
