<div class="login-page-container">
  <!-- Left Decorative Circles & Gradient -->
  <div class="login-bg-gradient">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>
    <div class="bg-circle circle-4"></div>
  </div>

  <!-- Right Section Content (Illustration) -->
  <div class="login-illustration-section">
    <img src="/login_illustration.png" alt="EVN HaNoi Security Illustration" class="illustration-img" />
  </div>

  <!-- Login Card Floating on Left side -->
  <div class="login-card-container">
    <div class="login-card shadow-4">

      <!-- Brand Logo EVN HaNoi -->
      <div class="brand-logo-wrapper">
        <img src="/assets/logo/logoevnhanoi.jpg" alt="EVN HaNoi Logo" class="brand-logo-img-large" />
      </div>

      <!-- App Title -->
      <h2 class="app-title">HỆ THỐNG SỐ HÓA HỒ SƠ KỸ THUẬT ĐƯỜNG DÂY VÀ TRẠM</h2>

      <!-- Error Alert -->
      <div *ngIf="error" class="login-error-alert animate-fade-in">
        <i class="pi pi-exclamation-circle mr-2"></i>
        <span>{{ error }}</span>
      </div>

      <!-- Login Form -->
      <form (submit)="onLocalLogin($event)" class="login-form">
        <!-- Username input -->
        <div class="form-group">
          <label class="form-label">Tên đăng nhập<span class="text-danger">*</span></label>
          <div class="input-wrapper">
            <i class="pi pi-user input-icon"></i>
            <input type="text" [(ngModel)]="username" name="username" placeholder="Nhập tên đăng nhập..." required
              autocomplete="username" />
          </div>
        </div>

        <!-- Password input -->
        <div class="form-group">
          <label class="form-label">Mật khẩu<span class="text-danger">*</span></label>
          <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
              placeholder="Nhập mật khẩu..." required autocomplete="current-password" />
            <i class="pi password-toggle-icon" [class.pi-eye]="!showPassword" [class.pi-eye-slash]="showPassword"
              (click)="showPassword = !showPassword"></i>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMeCheck" name="rememberMe" [(ngModel)]="rememberMe" />
            <span>Nhớ tài khoản</span>
          </label>
          <a href="javascript:void(0)" class="forgot-password-link">Quên mật khẩu?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" [disabled]="localLoading">
          <span *ngIf="!localLoading">Đăng nhập</span>
          <i class="pi pi-spin pi-spinner" *ngIf="localLoading"></i>
        </button>

        <!-- SSO Divider -->
        <div class="sso-divider">
          <span>HOẶC ĐĂNG NHẬP BẰNG</span>
        </div>

        <!-- SSO Button -->
        <button type="button" class="btn-sso" (click)="onSsoLogin()" [disabled]="loading">
          <i class="pi pi-shield mr-2"></i>
          <span>Đăng nhập qua EVN SSO</span>
          <i class="pi pi-spin pi-spinner ml-2" *ngIf="loading"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- Calendar Icon bottom-right -->
  <div class="calendar-watermark shadow-2">
    <div class="calendar-header">
      <span class="header-dot"></span>
      <span class="header-dot"></span>
      <span class="header-dot"></span>
    </div>
    <div class="calendar-body">
      <span class="day-number">19</span>
    </div>
  </div>
</div>
