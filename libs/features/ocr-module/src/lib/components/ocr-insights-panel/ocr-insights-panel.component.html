<p-dialog
  [visible]="visible"
  (visibleChange)="onHide()"
  [modal]="true"
  [style]="{ width: '960px' }"
  styleClass="evn-dialog-custom"
  [header]="'Phân tích OCR nâng cao' + (sourceDocument?.documentLabel ? ' — ' + sourceDocument?.documentLabel : '')"
>
  @if (visible && sourceDocument) {
    <lib-ocr-insights-content [sourceDocument]="sourceDocument"></lib-ocr-insights-content>
  }
</p-dialog>
