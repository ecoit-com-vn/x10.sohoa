<div class="wf-page">
  <div class="list-toolbar standard-page-toolbar">
    <div class="toolbar-left">
      <wf-breadcrumb
        [leafLabel]="listTitle()"
        [suffix]="currentView() === 'list' ? null : breadcrumbCurrent()"
        (listClick)="onBackToList()"
      />
    </div>
    <div class="toolbar-right dossier-form-actions">
      <ng-container *ngIf="currentView() === 'form'">
        <button
          type="button"
          class="btn-cancel dossier-form-action"
          (click)="dossierForm()?.onCancel()"
          title="Hủy">
          <i class="pi pi-times"></i> Hủy
        </button>
        <button
          *ngIf="menuScope() === 'creator' && selectedDossierId() && !inputCompleted()"
          type="button"
          class="btn-green dossier-form-action"
          (click)="dossierForm()?.requestCompleteInput()"
          [disabled]="dossierForm()?.completingInput()"
          title="Hoàn thành nhập liệu">
          <i class="pi pi-check" *ngIf="!dossierForm()?.completingInput()"></i>
          <i class="pi pi-spin pi-spinner" *ngIf="dossierForm()?.completingInput()"></i>
          Hoàn thành nhập liệu
        </button>
        <button
          *ngIf="menuScope() === 'creator' && selectedDossierId() && inputCompleted()"
          type="button"
          class="btn-green dossier-form-action"
          (click)="dossierForm()?.openSubmitWorkflowDialog()"
          [disabled]="dossierForm()?.submitting()"
          title="Gửi duyệt">
          <i class="pi pi-send" *ngIf="!dossierForm()?.submitting()"></i>
          <i class="pi pi-spin pi-spinner" *ngIf="dossierForm()?.submitting()"></i>
          Gửi duyệt
        </button>
        <button
          type="button"
          class="btn-save dossier-form-action"
          (click)="dossierForm()?.onSave()"
          [disabled]="!dossierForm() || dossierForm()?.isSaving() || !dossierForm()?.isValid()"
          title="Lưu lại">
          <i class="pi pi-save"></i> Lưu lại
        </button>
      </ng-container>
      <ng-container *ngIf="currentView() === 'detail' && dossierDetail() as detail">
        <button type="button" (click)="detail.onCancel()" class="btn-back btn-small">
          <i class="pi pi-arrow-left"></i> Quay lại danh sách
        </button>
        <button *ngIf="detail.canEditDossier()" type="button" (click)="detail.onEdit()" class="btn-save btn-small">
          <i class="pi pi-pencil"></i> Sửa hồ sơ
        </button>
        <button *ngIf="detail.showCompleteInputButton()" type="button" (click)="detail.onCompleteInput()"
          class="btn-green btn-small" [disabled]="detail.submitting()">
          <i class="pi pi-check" *ngIf="!detail.submitting()"></i>
          <i class="pi pi-spin pi-spinner" *ngIf="detail.submitting()"></i>
          Hoàn thành nhập liệu
        </button>
        <button *ngIf="detail.showSubmitForApprovalButton()" type="button"
          (click)="detail.openSubmitWorkflowDialog()" class="btn-save btn-small" [disabled]="detail.submitting()">
          <i class="pi pi-send" *ngIf="!detail.submitting()"></i>
          <i class="pi pi-spin pi-spinner" *ngIf="detail.submitting()"></i>
          Gửi duyệt
        </button>
        <button *ngIf="detail.showPublishButton()" type="button" (click)="detail.requestPublishAction('publish')"
          class="btn-green btn-small" [disabled]="detail.publishActionSubmitting()">
          <i class="pi pi-cloud-upload"></i> Xuất bản
        </button>
        <button *ngIf="detail.showUnpublishButton()" type="button" (click)="detail.requestPublishAction('unpublish')"
          class="btn-cancel btn-small" [disabled]="detail.publishActionSubmitting()">
          <i class="pi pi-ban"></i> Hủy xuất bản
        </button>
        <button *ngIf="detail.showRepublishButton()" type="button" (click)="detail.requestPublishAction('republish')"
          class="btn-green btn-small" [disabled]="detail.publishActionSubmitting()">
          <i class="pi pi-refresh"></i> Tái xuất bản
        </button>
        <ng-container *ngIf="detail.detailDynamicButtons().length > 0 && detail.isUserAuthorizedForDetailAction">
          <button *ngFor="let btn of detail.detailDynamicButtons()" type="button" class="btn-small"
            [class.btn-cancel]="detail.isRejectLabel(btn.label)"
            [class.btn-save]="detail.isApproveLabel(btn.label)"
            [class.btn-green]="!detail.isRejectLabel(btn.label) && !detail.isApproveLabel(btn.label)"
            (click)="detail.openActionDialog(btn)">
            <i class="pi" [class.pi-check]="!detail.isRejectLabel(btn.label)"
              [class.pi-times]="detail.isRejectLabel(btn.label)" style="margin-right: 4px;"></i>
            {{ btn.label }}
          </button>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="showHeaderImportActions()">
        <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" accept=".xlsx" />
        <button type="button" class="btn-outlined" style="padding: 0 14px;" (click)="onExportTemplate()">
          <i class="pi pi-download"></i> Xuất mẫu import
        </button>
        <button type="button" class="btn-outlined" style="padding: 0 14px;" (click)="fileInput.click()">
          <i class="pi pi-upload"></i> Import
        </button>
      </ng-container>
      <button
        *ngIf="currentView() === 'list'"
        type="button"
        class="btn-outlined"
        style="padding: 0 14px;"
        (click)="onExportExcel()"
        [disabled]="isExportingExcel()">
        <i class="pi pi-spin pi-spinner" *ngIf="isExportingExcel()"></i>
        <i class="pi pi-file-excel" *ngIf="!isExportingExcel()"></i> Xuất Excel
      </button>
      <button
        *ngIf="showHeaderCreateButton()"
        type="button"
        class="btn-green"
        (click)="onCreate()">
        <i class="pi pi-plus"></i> {{ menuScope() === 'creator' ? 'Tạo hồ sơ mới' : 'Thêm mới' }}
      </button>
    </div>
  </div>

  <app-dossier-list
    *ngIf="routeReady() && currentView() === 'list' && menuScope() !== 'publisher'"
    [menuScope]="menuScope()"
    [kindId]="kindId()"
    (viewDetail)="onViewDetail($event)"
    (edit)="onEdit($event)"
    (create)="onCreate()"
  ></app-dossier-list>

  <app-dossier-publish
    *ngIf="currentView() === 'list' && menuScope() === 'publisher'"
    (viewDetail)="onViewDetail($event)"
    (edit)="onEdit($event)"
  ></app-dossier-publish>

  <app-dossier-form
    *ngIf="currentView() === 'form'"
    [dossierId]="selectedDossierId()"
    [kindId]="kindId()"
    [usePublishApi]="menuScope() === 'publisher'"
    [hideInfrastructureField]="menuScope() === 'publisher'"
    [hideGridTypeField]="menuScope() === 'creator' && kindId() === 2"
    (cancel)="onBackToList()"
    (inputCompleted)="inputCompleted.set(true)"
    (statusLoaded)="inputCompleted.set($event === 2)"
    (saved)="onSaved($event)"
  ></app-dossier-form>

  <app-dossier-detail
    *ngIf="currentView() === 'detail' && selectedDossierId()"
    [dossierId]="selectedDossierId()!"
    [menuScope]="menuScope()"
    [fromContext]="menuFrom() ?? undefined"
    (cancel)="onBackToList()"
    (edit)="onEdit(selectedDossierId()!)"
  ></app-dossier-detail>

</div>
