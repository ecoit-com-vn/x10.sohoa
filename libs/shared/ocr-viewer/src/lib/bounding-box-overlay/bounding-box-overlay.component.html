<div class="overlay-toolbar">
  <button type="button" class="btn-zoom" (click)="zoomOut()" title="Thu nhỏ"><i class="pi pi-search-minus"></i></button>
  <button type="button" class="btn-zoom" (click)="resetZoom()" title="Đặt lại">{{ (zoom() * 100).toFixed(0) }}%</button>
  <button type="button" class="btn-zoom" (click)="zoomIn()" title="Phóng to"><i class="pi pi-search-plus"></i></button>
</div>

<div class="overlay-scroll">
  <div class="overlay-canvas" [style.width.px]="naturalWidth * zoom()" [style.height.px]="naturalHeight * zoom()">
    @if (imageUrl) {
      <img [src]="imageUrl" [style.width.%]="100" [style.height.%]="100" alt="Ảnh trang tài liệu" />
    }
    @for (region of regions; track region.id) {
      <div
        class="overlay-box"
        [ngClass]="region.colorClass ?? 'region-text'"
        [style.left.%]="leftPercent(region)"
        [style.top.%]="topPercent(region)"
        [style.width.%]="widthPercent(region)"
        [style.height.%]="heightPercent(region)"
        [title]="region.tooltip ?? region.label ?? ''"
        (click)="onRegionClick(region)"
      ></div>
    }
  </div>
</div>
