<p-toast></p-toast>
<div class="notification-container">
  <p-button
    icon="pi pi-bell"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    (onClick)="op.toggle($event)">
  </p-button>
  <p-badge *ngIf="unreadCount() > 0" [value]="unreadCount().toString()" size="small" severity="danger" styleClass="notification-badge"></p-badge>

  <p-popover #op>
    <div class="p-2" style="width: 320px;">
      <h4 class="mb-2 mt-0">Thông báo</h4>
      <div *ngIf="notifications().length === 0" class="text-gray-500">
        Không có thông báo mới.
      </div>
      <div
        *ngFor="let notif of notifications()"
        class="notification-item p-2 border-round surface-100 flex justify-content-between align-items-start"
        [class.font-bold]="!notif.isRead"
        (click)="onOpenNotification(notif)">
        <div>
          <strong>{{ notif.title }}</strong>
          <p class="m-0 text-sm">{{ notif.body }}</p>
          <span class="notification-time">{{ notif.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
        <p-button
          icon="pi pi-times"
          [text]="true"
          [rounded]="true"
          size="small"
          styleClass="notification-delete-btn"
          title="Xóa thông báo"
          (onClick)="deleteNotification(notif, $event)">
        </p-button>
      </div>
      <div *ngIf="notifications().length > 0" class="mt-2 text-right">
        <p-button label="Xóa tất cả" [text]="true" size="small" (onClick)="clearNotifications()"></p-button>
      </div>
    </div>
  </p-popover>
</div>
