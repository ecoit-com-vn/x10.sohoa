<p-toast></p-toast>
<div class="notification-container">
  <p-button
    icon="pi pi-bell"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    (onClick)="op.toggle($event)">
    <p-badge *ngIf="unreadCount() > 0" [value]="unreadCount().toString()" severity="danger" styleClass="notification-badge"></p-badge>
  </p-button>

  <p-popover #op>
    <div class="p-3" style="width: 320px;">
      <h4 class="mb-3">Thông báo</h4>
      <div *ngIf="notifications().length === 0" class="text-gray-500">
        Không có thông báo mới.
      </div>
      <div
        *ngFor="let notif of notifications()"
        class="notification-item p-2 mb-2 border-round surface-100 flex justify-content-between align-items-start"
        [class.font-bold]="!notif.isRead"
        (click)="onOpenNotification(notif)">
        <div>
          <strong>{{ notif.title }}</strong>
          <p class="m-0 text-sm">{{ notif.body }}</p>
        </div>
        <button
          type="button"
          class="p-button p-button-text p-button-sm pi pi-times"
          title="Xóa thông báo"
          (click)="deleteNotification(notif, $event)">
        </button>
      </div>
      <div *ngIf="notifications().length > 0" class="mt-3 text-right">
        <p-button label="Xóa tất cả" [text]="true" size="small" (onClick)="clearNotifications()"></p-button>
      </div>
    </div>
  </p-popover>
</div>
