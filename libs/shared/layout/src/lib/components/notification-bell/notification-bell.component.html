<p-toast></p-toast>
<div class="notification-container">
  <p-button
    icon="pi pi-bell"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    (onClick)="op.toggle($event)">
  </p-button>
  <p-badge *ngIf="unreadCount() > 0" [value]="unreadCount().toString()" size="small" severity="danger" styleClass="notification-badge"></p-badge>

  <p-popover #op>
    <div class="p-2" style="width: 320px;">
      <div *ngIf="notifications().length === 0" class="text-gray-500">
        Không có thông báo mới.
      </div>
      <div class="notification-list">
        <div
          *ngFor="let notif of notifications()"
          class="notification-item p-2 flex justify-content-between align-items-center"
          [class.notification-unread]="!notif.isRead"
          (click)="onOpenNotification(notif)">
          <div>
            <span class="notification-title">
              {{ notificationTitle(notif) }}
            </span>
            <p class="notification-body m-0">{{ notificationBody(notif) }}</p>
            <span class="notification-time">{{ notif.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
          </div>
          <button
            type="button"
            class="notification-delete-btn"
            title="Xóa thông báo"
            aria-label="Xóa thông báo"
            (click)="deleteNotification(notif, $event)">
            <i class="pi pi-trash"></i>
          </button>
        </div>
      </div>
      <div *ngIf="notifications().length > 0" class="notification-footer">
        <button type="button" class="clear-notifications-btn" (click)="clearNotifications()">
          Xóa tất cả thông báo
        </button>
      </div>
    </div>
  </p-popover>
</div>
