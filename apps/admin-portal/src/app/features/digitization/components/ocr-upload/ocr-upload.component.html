<p-toast></p-toast>
<p-card header="OCR Document Upload">
  <p>Upload scanned documents or images for OCR extraction.</p>
  
  <p-fileUpload 
    name="ocrFile[]" 
    url="https://www.primefaces.org/cdn/api/upload.php" 
    (onUpload)="onUpload($event)" 
    [multiple]="true" 
    accept="image/*,application/pdf" 
    maxFileSize="10000000"
    [customUpload]="false"
    styleClass="mt-4">
    
    <ng-template pTemplate="content">
        <ul *ngIf="false"></ul> <!-- Custom content area if needed -->
    </ng-template>
  </p-fileUpload>
</p-card>
